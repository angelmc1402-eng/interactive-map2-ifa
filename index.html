<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HALL 2 - Ultimate Builder</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
    :root {
        --verde-base: #2ecc71;
        --azul-sel: #00d2d3;
        --rojo-del: #ff6b6b;
        --dark-bg: #222f3e;
        --panel-bg: #ffffff;
        --fuente: 'Inter', sans-serif;
    }

    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: var(--dark-bg); font-family: var(--fuente); }
    
    #viewport { width: 100vw; height: 100vh; overflow: auto; display: block; cursor: grab; }
    #viewport:active { cursor: grabbing; }
    
    #container { position: relative; transform-origin: 0 0; transition: transform 0.05s ease-out; display: inline-block; }
    img { display: block; image-rendering: high-quality; max-width: none; pointer-events: none; user-select: none; }

    /* MESAS */
    .mesa { 
        position: absolute; 
        border: 1px solid var(--verde-base); 
        background: rgba(46, 204, 113, 0.3); 
        z-index: 10; cursor: pointer; 
        box-sizing: border-box;
    }
    
    .mesa:hover { background: rgba(46, 204, 113, 0.6); z-index: 100; border-color: white; }
    
    .mesa.selected {
        border: 2px solid var(--azul-sel);
        background: rgba(0, 210, 211, 0.5);
        z-index: 200;
        box-shadow: 0 0 20px rgba(0, 210, 211, 0.4);
    }

    /* PALETA IZQUIERDA */
    #palette {
        position: fixed; top: 10px; left: 10px; width: 240px; bottom: 10px;
        background: var(--panel-bg); padding: 15px; border-radius: 8px;
        box-shadow: 5px 0 30px rgba(0,0,0,0.3); z-index: 20000;
        display: flex; flex-direction: column;
    }
    
    #palette h3 { margin: 0 0 15px 0; font-size: 14px; color: #333; text-transform: uppercase; border-bottom: 2px solid #eee; padding-bottom: 10px; }
    
    .scroll-area { flex: 1; overflow-y: auto; padding-right: 5px; }
    
    .section-group { margin-bottom: 20px; }
    .group-title { font-size: 11px; font-weight: 800; color: #888; margin-bottom: 5px; letter-spacing: 1px; }
    
    .piece-btn {
        display: flex; justify-content: space-between; align-items: center;
        width: 100%; padding: 8px 12px; margin-bottom: 6px;
        background: #f7f7f7; border: 1px solid #ddd; border-radius: 6px;
        cursor: pointer; transition: all 0.1s; font-size: 12px; font-weight: 600; color: #444;
    }
    .piece-btn:hover { background: #e0e0e0; transform: translateX(2px); border-color: #bbb; }
    .piece-btn:active { transform: scale(0.98); }
    
    .tag-v { background: #fab1a0; color: #d63031; padding: 2px 5px; border-radius: 3px; font-size: 9px; }
    .tag-h { background: #81ecec; color: #00cec9; padding: 2px 5px; border-radius: 3px; font-size: 9px; }
    .tag-d { background: #ffeaa7; color: #fdcb6e; padding: 2px 5px; border-radius: 3px; font-size: 9px; }

    /* PROPIEDADES (FLOTANTE) */
    #prop-float {
        position: fixed; top: 20px; right: 20px; background: white; padding: 15px;
        border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); z-index: 20000;
        width: 200px; display: none;
    }
    #prop-float.active { display: block; animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    @keyframes popIn { from { transform: scale(0.9); opacity:0; } to { transform: scale(1); opacity:1; } }

    .btn-action { width: 100%; padding: 10px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 8px; font-size: 12px; }
    .btn-dup { background: var(--verde-base); color: white; }
    .btn-del { background: var(--rojo-del); color: white; }

    /* BARRA EXPORTAR */
    #export-bar {
        position: fixed; bottom: 20px; left: 270px; right: 20px;
        pointer-events: none; display: flex; justify-content: center; z-index: 20000;
    }
    .btn-exp { pointer-events: auto; background: #2d3436; color: #00d2d3; border: 2px solid #00d2d3; padding: 12px 30px; border-radius: 50px; font-weight: 800; cursor: pointer; box-shadow: 0 10px 20px rgba(0,0,0,0.4); transition: transform 0.2s; }
    .btn-exp:hover { transform: translateY(-3px) scale(1.05); background: #00d2d3; color: white; }

    #clipboard-area { position: absolute; left: -9999px; }
</style>
</head>
<body>

    <div id="palette">
        <h3>🏭 Fábrica de Mesas</h3>
        <div class="scroll-area">
            
            <div class="section-group">
                <div class="group-title">TCG / SPORT (Estándar)</div>
                <div id="btn-container-std"></div>
            </div>

            <div class="section-group">
                <div class="group-title">DIECAST (Anchas)</div>
                <div id="btn-container-die"></div>
            </div>

            <div class="section-group">
                <div class="group-title">MANGA / FIGURES</div>
                <div id="btn-container-man"></div>
            </div>

        </div>
        <div style="font-size:10px; color:#999; margin-top:10px; text-align:center; border-top:1px solid #eee; padding-top:10px;">
            Rueda Ratón: <b>ZOOM</b><br>
            Click + Arrastrar: <b>MOVER PIEZA</b><br>
            Flechas: <b>PRECISIÓN</b><br>
            Supr: <b>BORRAR</b>
        </div>
    </div>

    <div id="prop-float">
        <label style="font-size:10px; font-weight:bold; color:#999;">ID MESA</label>
        <input type="text" id="inp-id" style="width:100%; padding:8px; border:2px solid #ddd; border-radius:4px; font-weight:bold; font-family:monospace; margin-bottom:10px;">
        
        <button class="btn-action btn-dup" onclick="duplicateSelected()">DUPLICAR (D)</button>
        <button class="btn-action btn-del" onclick="deleteSelected()">ELIMINAR (Supr)</button>
    </div>

    <div id="export-bar">
        <button class="btn-exp" onclick="exportHTML()">💾 EXPORTAR CÓDIGO HTML</button>
    </div>

    <div id="viewport">
        <div id="container">
            <img id="map-img" src="Hall 2.png" alt="Map Hall 2">
            <div id="capa-mesas"></div> 
        </div>
    </div>

    <textarea id="clipboard-area"></textarea>

<script>
    // --- CONFIGURACIÓN DE TAMAÑOS ---
    const SIZES = {
        'std-v': { w: 0.2187, h: 1.1726 }, // Vertical Estándar
        'std-h': { w: 0.8613, h: 0.2977 }, // Horizontal Estándar
        'wide':  { w: 1.1300, h: 0.2977 }  // Diecast Ancha
    };

    // --- CONFIGURACIÓN DE BOTONES ---
    // Añade aquí las letras que necesites
    const GROUPS = {
        'TCG': ['A','B','C','D','E','F','G','H','I','J','K','L','M','N'],
        'SPORT': ['A','B','C','D','E','F'],
        'DIECAST': ['A','B','C','D'],
        'MANGA': ['A','B'],
        'FIGURES': ['A','B']
    };

    let scale = 0.2;
    const container = document.getElementById('container');
    const viewport = document.getElementById('viewport');
    const mapImg = document.getElementById('map-img');
    const capaMesas = document.getElementById('capa-mesas');
    const propPanel = document.getElementById('prop-float');
    const inputId = document.getElementById('inp-id');

    let selectedElement = null;
    let isDragging = false;
    let dragOffset = { x: 0, y: 0 };

    // 1. INICIALIZACIÓN
    window.onload = () => {
        generateButtons();
        if(mapImg.complete) init();
        else mapImg.onload = init;
    };

    async function init() {
        fit();
        // Intentar cargar mesas previas
        try {
            const resp = await fetch('mesas.html?v=' + Date.now());
            if(resp.ok) {
                capaMesas.innerHTML = await resp.text();
                document.querySelectorAll('.mesa').forEach(addInteractions);
            }
        } catch(e) {}
        
        // Listener de Zoom con Rueda
        viewport.addEventListener('wheel', handleWheel, { passive: false });
    }

    // 2. GENERADOR DE BOTONES
    function generateButtons() {
        // TCG & SPORT (Mezcla de H y V)
        const cStd = document.getElementById('btn-container-std');
        ['TCG', 'SPORT'].forEach(cat => {
            GROUPS[cat].forEach(letra => {
                createBtn(cStd, `${cat}-${letra}`, 'std-v', 'V');
                createBtn(cStd, `${cat}-${letra}`, 'std-h', 'H');
            });
        });

        // DIECAST (Solo Wide)
        const cDie = document.getElementById('btn-container-die');
        GROUPS['DIECAST'].forEach(letra => {
            createBtn(cDie, `DIECAST-${letra}`, 'wide', 'W');
        });

        // MANGA/FIGURES (Estándar)
        const cMan = document.getElementById('btn-container-man');
        ['MANGA', 'FIGURES'].forEach(cat => {
            GROUPS[cat].forEach(letra => {
                createBtn(cMan, `${cat}-${letra}`, 'std-v', 'V');
                createBtn(cMan, `${cat}-${letra}`, 'std-h', 'H');
            });
        });
    }

    function createBtn(container, label, sizeKey, tag) {
        const btn = document.createElement('div');
        btn.className = 'piece-btn';
        let colorClass = tag === 'V' ? 'tag-v' : (tag === 'W' ? 'tag-d' : 'tag-h');
        
        btn.innerHTML = `<span>${label}</span> <span class="${colorClass}">${tag}</span>`;
        btn.onclick = () => spawnTable(label + '-1', sizeKey);
        container.appendChild(btn);
    }

    // 3. SPAWN (CREAR MESA)
    window.spawnTable = function(idName, sizeKey) {
        const size = SIZES[sizeKey];
        const div = document.createElement('div');
        div.className = 'mesa';
        div.setAttribute('data-info', idName);
        
        // Calcular centro de la pantalla actual
        const rect = viewport.getBoundingClientRect();
        const centerX = (rect.width / 2 - container.getBoundingClientRect().left) / scale;
        const centerY = (rect.height / 2 - container.getBoundingClientRect().top) / scale;

        // Convertir a %
        const leftP = (centerX / mapImg.naturalWidth) * 100;
        const topP = (centerY / mapImg.naturalHeight) * 100;

        div.style.width = size.w + '%';
        div.style.height = size.h + '%';
        div.style.top = topP.toFixed(4) + '%';
        div.style.left = leftP.toFixed(4) + '%';

        capaMesas.appendChild(div);
        addInteractions(div);
        selectMesa(div);
    }

    // 4. INTERACCIONES
    function addInteractions(el) {
        el.addEventListener('mousedown', (e) => {
            e.stopPropagation();
            selectMesa(el);
            isDragging = true;
            const rect = el.getBoundingClientRect();
            dragOffset.x = e.clientX - rect.left;
            dragOffset.y = e.clientY - rect.top;
        });
    }

    document.addEventListener('mousemove', (e) => {
        if (!isDragging || !selectedElement) return;
        e.preventDefault();

        const containerRect = container.getBoundingClientRect();
        let x = (e.clientX - containerRect.left - dragOffset.x) / scale;
        let y = (e.clientY - containerRect.top - dragOffset.y) / scale;

        const leftP = (x / mapImg.naturalWidth) * 100;
        const topP = (y / mapImg.naturalHeight) * 100;

        selectedElement.style.left = leftP.toFixed(4) + '%';
        selectedElement.style.top = topP.toFixed(4) + '%';
    });

    document.addEventListener('mouseup', () => isDragging = false);

    // 5. SELECCIÓN
    function selectMesa(el) {
        if(selectedElement) selectedElement.classList.remove('selected');
        selectedElement = el;
        selectedElement.classList.add('selected');
        
        propPanel.classList.add('active');
        inputId.value = selectedElement.getAttribute('data-info');
    }

    // Click fuera para deseleccionar
    viewport.addEventListener('mousedown', (e) => {
        if(e.target === viewport || e.target === container || e.target === mapImg) {
            if(selectedElement) selectedElement.classList.remove('selected');
            selectedElement = null;
            propPanel.classList.remove('active');
        }
    });

    // Actualizar nombre en tiempo real
    inputId.addEventListener('input', (e) => {
        if(selectedElement) selectedElement.setAttribute('data-info', e.target.value.toUpperCase());
    });

    // 6. ZOOM CON RUEDA (MEJORADO)
    function handleWheel(e) {
        if(e.ctrlKey || e.metaKey || true) { // Siempre activo
            e.preventDefault();
            const delta = e.deltaY > 0 ? 0.9 : 1.1;
            let newScale = scale * delta;
            if(newScale > 0.05 && newScale < 10) {
                scale = newScale;
                container.style.transform = `scale(${scale})`;
            }
        }
    }

    // 7. DUPLICAR Y BORRAR
    window.duplicateSelected = function() {
        if(!selectedElement) return;
        const clone = selectedElement.cloneNode(true);
        
        // Auto-incrementar ID
        const oldId = selectedElement.getAttribute('data-info');
        const parts = oldId.split('-');
        if(!isNaN(parts[parts.length-1])) {
            parts[parts.length-1] = parseInt(parts[parts.length-1]) + 1;
            clone.setAttribute('data-info', parts.join('-'));
        }

        // Desplazamiento inteligente
        const w = parseFloat(selectedElement.style.width);
        const h = parseFloat(selectedElement.style.height);
        let top = parseFloat(selectedElement.style.top);
        let left = parseFloat(selectedElement.style.left);

        // Si es más ancha que alta -> Duplicar a la derecha
        if(w > h) left += (w + 0.02); 
        // Si es más alta que ancha -> Duplicar abajo
        else top += (h + 0.02);

        clone.style.top = top.toFixed(4) + '%';
        clone.style.left = left.toFixed(4) + '%';

        capaMesas.appendChild(clone);
        addInteractions(clone);
        selectMesa(clone);
    }

    window.deleteSelected = function() {
        if(selectedElement) {
            selectedElement.remove();
            selectedElement = null;
            propPanel.classList.remove('active');
        }
    }

    // 8. TECLADO
    document.addEventListener('keydown', (e) => {
        if(!selectedElement) return;
        
        // Movimiento fino
        if(e.key.startsWith('Arrow')) {
            e.preventDefault();
            const step = e.shiftKey ? 0.1 : 0.01; // Shift para ir más rápido
            let t = parseFloat(selectedElement.style.top);
            let l = parseFloat(selectedElement.style.left);
            
            if(e.key === 'ArrowUp') t -= step;
            if(e.key === 'ArrowDown') t += step;
            if(e.key === 'ArrowLeft') l -= step;
            if(e.key === 'ArrowRight') l += step;
            
            selectedElement.style.top = t.toFixed(4) + '%';
            selectedElement.style.left = l.toFixed(4) + '%';
        }

        if(e.key === 'Delete' || e.key === 'Backspace') {
            if(document.activeElement !== inputId) deleteSelected();
        }
        
        if(e.key.toLowerCase() === 'd') {
            if(document.activeElement !== inputId) duplicateSelected();
        }
    });

    // 9. EXPORTAR
    window.exportHTML = function() {
        let html = "";
        document.querySelectorAll('.mesa').forEach(m => {
            html += `<div class="mesa" data-info="${m.getAttribute('data-info')}" style="${m.getAttribute('style')}"></div>\n`;
        });
        const area = document.getElementById('clipboard-area');
        area.value = html;
        area.select();
        document.execCommand('copy');
        alert("¡Copiado! " + document.querySelectorAll('.mesa').length + " mesas listas.");
    }

    function fit() {
        const imgWidth = mapImg.naturalWidth || 5000;
        scale = (window.innerWidth / imgWidth) * 0.9;
        container.style.transform = `scale(${scale})`;
    }

</script>
</body>
</html>
