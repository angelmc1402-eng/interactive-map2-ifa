<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HALL 2 - Builder Mode</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
    :root {
        --verde-base: #2ecc71;
        --verde-deep: #27ae60;
        --verde-sport: #00ffb4;
        --rojo-sold: #e74c3c;
        --text-gray: #95a5a6;
        --fuente: 'Inter', sans-serif;
    }

    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #f0f0f0; font-family: var(--fuente); }
    
    #viewport { width: 100vw; height: 100vh; overflow: auto; display: block; }
    #container { position: relative; transform-origin: 0 0; transition: transform 0.2s ease-out; display: inline-block; }
    img { display: block; image-rendering: high-quality; max-width: none; cursor: crosshair; }

    /* MESAS */
    .mesa { 
        position: absolute; border: 2px solid var(--verde-base); 
        background: rgba(46, 204, 113, 0.25); box-sizing: border-box; 
        z-index: 10; border-radius: 4px; cursor: pointer; 
    }
    
    /* MESA FANTASMA (PREVIEW) */
    #ghost-mesa {
        position: absolute;
        border: 2px dashed #e74c3c;
        background: rgba(231, 76, 60, 0.5);
        z-index: 20000;
        pointer-events: none; /* Para poder seguir haciendo click */
        display: none;
    }

    /* CONTROLES NAVEGACIÓN */
    .controls-wrapper { position: fixed; bottom: 30px; left: 30px; display: flex; flex-direction: column; gap: 15px; z-index: 10000; }
    .joystick, .zoom-pill { background: white; padding: 12px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
    .joystick { display: grid; grid-template-columns: repeat(3, 45px); gap: 5px; }
    .zoom-pill { display: flex; gap: 8px; }
    .nav-btn, .action-btn { width: 45px; height: 45px; border: none; background: #f0f0f0; border-radius: 10px; font-size: 18px; cursor: pointer; font-weight: bold; }
    .nav-btn:hover, .action-btn:hover { background: var(--verde-base); color: white; }

    /* --- BUILDER MENU (NUEVO) --- */
    #builder-menu {
        position: fixed; top: 20px; right: 20px; width: 300px;
        background: white; padding: 20px; border-radius: 12px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.3); z-index: 20000;
        font-family: 'Inter', sans-serif; font-size: 12px;
        max-height: 90vh; overflow-y: auto;
    }
    #builder-menu h2 { margin-top: 0; color: #333; font-size: 16px; }
    .input-group { margin-bottom: 10px; }
    .input-group label { display: block; font-weight: bold; color: #666; margin-bottom: 4px; }
    .input-group input { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-family: monospace; }
    .btn-row { display: flex; gap: 5px; margin-bottom: 15px; }
    .b-btn { flex: 1; padding: 8px; background: #333; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 11px; }
    .b-btn:hover { background: #555; }
    .b-btn.preset { background: var(--verde-deep); }
    
    #code-output {
        width: 100%; height: 80px; background: #2d3436; color: #00ffb4;
        border: none; padding: 10px; border-radius: 4px; font-family: monospace; font-size: 11px;
        margin-top: 10px; resize: none;
    }
</style>
</head>
<body>

    <div id="builder-menu">
        <h2>🛠️ Mapeador Hall 2</h2>
        <div class="input-group">
            <label>ID Mesa (Ej: TCG-G-1)</label>
            <input type="text" id="inp-id" value="TCG-G-1">
        </div>
        
        <label style="font-weight:bold; display:block; margin-bottom:5px;">Tamaños (Originales Hall 1)</label>
        <div class="btn-row">
            <button class="b-btn preset" onclick="setPreset('vertical')">Vertical</button>
            <button class="b-btn preset" onclick="setPreset('horizontal')">Horizontal</button>
        </div>

        <div class="input-group">
            <label>Top (%)</label>
            <input type="text" id="inp-top">
        </div>
        <div class="input-group">
            <label>Left (%)</label>
            <input type="text" id="inp-left">
        </div>
        <div class="input-group">
            <label>Width (%)</label>
            <input type="text" id="inp-width">
        </div>
        <div class="input-group">
            <label>Height (%)</label>
            <input type="text" id="inp-height">
        </div>

        <button class="b-btn" style="background:var(--verde-base); font-size:14px; font-weight:bold;" onclick="copyCode()">COPIAR CÓDIGO HTML</button>
        <textarea id="code-output" readonly></textarea>
        <p style="color:#999; font-size:10px; margin-top:5px;">*Haz click en el mapa para situar la mesa.</p>
    </div>

    <div id="viewport">
        <div id="container">
            <img id="map-img" src="Hall 2.png" alt="Map Hall 2">
            <div id="ghost-mesa"></div>
            <div id="capa-mesas"></div> 
        </div>
    </div>

    <div class="controls-wrapper">
        <div class="joystick">
            <button class="nav-btn" style="grid-column:2" onclick="move('up')">↑</button>
            <button class="nav-btn" style="grid-column:1; grid-row:2" onclick="move('left')">←</button>
            <button class="nav-btn" style="grid-column:3; grid-row:2" onclick="move('right')">→</button>
            <button class="nav-btn" style="grid-column:2; grid-row:3" onclick="move('down')">↓</button>
        </div>
        <div class="zoom-pill">
            <button class="action-btn" onclick="zoom(1.2)">+</button>
            <button class="action-btn" onclick="zoom(0.8)">-</button>
        </div>
    </div>

<script>
    let scale = 0.2; // Empezamos lejos para ver todo
    const container = document.getElementById('container');
    const viewport = document.getElementById('viewport');
    const mapImg = document.getElementById('map-img');
    const ghost = document.getElementById('ghost-mesa');

    // Inputs
    const inpId = document.getElementById('inp-id');
    const inpTop = document.getElementById('inp-top');
    const inpLeft = document.getElementById('inp-left');
    const inpWidth = document.getElementById('inp-width');
    const inpHeight = document.getElementById('inp-height');
    const output = document.getElementById('code-output');

    // TAMAÑOS ORIGINALES HALL 1 (Conservados)
    const SIZE_VERT_W = "0.2187";
    const SIZE_VERT_H = "1.1726";
    const SIZE_HORIZ_W = "0.8613";
    const SIZE_HORIZ_H = "0.2977";

    // 1. CARGA INICIAL
    async function init() {
        // Cargar mesas existentes para ver referencias
        try {
            const resp = await fetch('mesas.html?v=' + Date.now());
            if(resp.ok) document.getElementById('capa-mesas').innerHTML = await resp.text();
        } catch(e) {}

        // Defaults
        setPreset('vertical');
        fit();
    }

    // 2. LÓGICA DE CLIC EN EL MAPA (LA MAGIA)
    mapImg.addEventListener('click', (e) => {
        const rect = mapImg.getBoundingClientRect();
        
        // Calcular posición exacta dentro de la imagen (sin importar zoom)
        const x = (e.clientX - rect.left) / scale; 
        const y = (e.clientY - rect.top) / scale;

        // Convertir a porcentajes (4 decimales de precisión)
        const leftP = ((x / mapImg.naturalWidth) * 100).toFixed(4);
        const topP = ((y / mapImg.naturalHeight) * 100).toFixed(4);

        // Actualizar inputs
        inpTop.value = topP;
        inpLeft.value = leftP;

        updateGhost();
        generateCode();
    });

    // 3. PRESETS DE TAMAÑO
    window.setPreset = function(type) {
        if(type === 'vertical') {
            inpWidth.value = SIZE_VERT_W;
            inpHeight.value = SIZE_VERT_H;
        } else {
            inpWidth.value = SIZE_HORIZ_W;
            inpHeight.value = SIZE_HORIZ_H;
        }
        updateGhost();
        generateCode();
    }

    // 4. ACTUALIZAR VISUALIZACIÓN
    function updateGhost() {
        ghost.style.display = 'block';
        ghost.style.top = inpTop.value + '%';
        ghost.style.left = inpLeft.value + '%';
        ghost.style.width = inpWidth.value + '%';
        ghost.style.height = inpHeight.value + '%';
    }

    function generateCode() {
        const html = `<div class="mesa" data-info="${inpId.value}" style="top:${inpTop.value}%; left:${inpLeft.value}%; width:${inpWidth.value}%; height:${inpHeight.value}%;"></div>`;
        output.value = html;
    }

    window.copyCode = function() {
        output.select();
        document.execCommand('copy');
        
        // Auto-incrementar ID para ir rápido (TCG-G-1 -> TCG-G-2)
        const parts = inpId.value.split('-');
        if(parts.length === 3 && !isNaN(parts[2])) {
            parts[2] = parseInt(parts[2]) + 1;
            inpId.value = parts.join('-');
        }
        alert("¡Código copiado! Pégalo en mesas.html");
    }

    // --- FUNCIONES DE ZOOM Y MOVIMIENTO ---
    window.zoom = function(f) {
        let newScale = scale * f;
        if (newScale >= 0.01) {
            scale = newScale;
            container.style.transform = `scale(${scale})`;
        }
    }
    
    window.move = function(dir) {
        const step = 200;
        if(dir==='up') viewport.scrollTop -= step;
        if(dir==='down') viewport.scrollTop += step;
        if(dir==='left') viewport.scrollLeft -= step;
        if(dir==='right') viewport.scrollLeft += step;
    }

    function fit() {
        // Zoom inicial alejado para ver todo el mapa
        const imgWidth = mapImg.naturalWidth || 5000;
        scale = (window.innerWidth / imgWidth) * 0.9;
        container.style.transform = `scale(${scale})`;
    }

    // Listeners de inputs para ajuste fino manual
    [inpTop, inpLeft, inpWidth, inpHeight].forEach(i => i.addEventListener('input', () => {
        updateGhost(); generateCode();
    }));

    window.onload = () => {
        if(mapImg.complete) init();
        else mapImg.onload = init;
    };

</script>
</body>
</html>
